# Пространство поиска Optuna (эксперимент 2). Остальные параметры берутся из base.yaml:
# 30 эпох, split_seed 0, seed обучения 0 — одинаково для всех trial.
study_name: lr0_search
storage: sqlite:///optuna.db
n_trials: 40
sampler: {type: TPESampler, seed: 42}
pruner: {type: MedianPruner, n_startup_trials: 5, n_warmup_steps: 5}
base_config: configs/base.yaml
seed: 0
space:
  lr: {type: float, low: 1.0e-4, high: 1.0e-1, log: true}
  n_layers: {type: int, low: 1, high: 3}
  hidden: {type: int, low: 32, high: 512, log: true}
  dropout: {type: float, low: 0.0, high: 0.5}
  weight_decay: {type: float, low: 1.0e-6, high: 1.0e-2, log: true}
  batch_size: {type: categorical, choices: [32, 64, 128]}
